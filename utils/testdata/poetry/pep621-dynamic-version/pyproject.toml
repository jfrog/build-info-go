# Poetry 2.0+ project whose version is set dynamically (e.g. by a versioning plugin) and is therefore not declared in [project].
[project]
name = "my-poetry-project"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "aiostream (>=0.8.1,<0.9.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

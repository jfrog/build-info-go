// jf gradle writes this file as --init-script. --include-shared-build becomes
// ORG_GRADLE_PROJECT_includeSharedBuild=true and -PincludeSharedBuild=true, which
// SharedBuildLogicUtils.isIncludeSharedBuildEnabled reads via Project.findProperty.
import org.jfrog.gradle.plugin.artifactory.ArtifactoryPlugin
import org.jfrog.gradle.plugin.artifactory.ArtifactoryPluginSettings
import org.jfrog.gradle.plugin.artifactory.Constant
import org.jfrog.gradle.plugin.artifactory.task.ArtifactoryTask
import org.jfrog.gradle.plugin.artifactory.utils.PluginUtils
import org.jfrog.gradle.plugin.artifactory.utils.SharedBuildLogicUtils

initscript {
    dependencies {
        classpath fileTree('${pluginLibDir}')
    }
}

PluginUtils.assertGradleVersionSupported(getGradle())

beforeSettings { Settings settings ->
    settings.apply plugin: ArtifactoryPluginSettings
}

projectsLoaded { Gradle gradle ->
    Map<String, String> projectProperties = new HashMap<String, String>(gradle.startParameter.getProjectProperties())
    projectProperties.put("build.start", Long.toString(System.currentTimeMillis()))
    gradle.startParameter.setProjectProperties(projectProperties)
    Project root = gradle.getRootProject()
    root.logger.debug("Artifactory plugin: projectsEvaluated: ${root.name}")

    // Flag on: apply to buildSrc too - since Gradle 8.0, --init-script is applied to buildSrc the
    // same as the main build and every includeBuild (each gets its own projectsLoaded firing with
    // its own live root Project), so buildSrc may itself be a used shared build. Flag off: keep
    // buildSrc excluded, unchanged from before. IMPORTANT: the buildSrc exclusion must only guard
    // the flag-off branch - putting it around the whole if/else (as an earlier version of this
    // script did) means buildSrc's own projectsLoaded firing (where root.name == "buildSrc")
    // never applies the plugin at all, even with the flag on, since neither branch's condition is
    // then satisfied for it.
    if (SharedBuildLogicUtils.isIncludeSharedBuildEnabled(root)) {
        applySharedBuildPlugin(root)
    } else if (!"buildSrc".equals(root.name)) {
        // Same apply as main (including a second apply if build.gradle also applies the plugin).
        root.allprojects {
            apply {
                apply plugin: ArtifactoryPlugin
            }
        }
    }

    // Set the CI Server mode to all Artifactory tasks.
    for (Project p : root.getAllprojects()) {
        try {
            TaskProvider<? extends Task> subCollectInfoTask = p.getTasks().named(Constant.ARTIFACTORY_PUBLISH_TASK_NAME, ArtifactoryTask.class);
            subCollectInfoTask.configure { task ->
                task.setCiServerBuild()
            }
        } catch (UnknownTaskException ignored) {
            root.logger.debug("Can't find sub project configured for {}", p.getPath());
        }
    }
}

void applySharedBuildPlugin(Project root) {
    root.allprojects { Project p ->
        applyArtifactoryIfMissing(p)
    }
}

void applyArtifactoryIfMissing(Project project) {
    if (project.extensions.findByName(Constant.ARTIFACTORY) != null) {
        return
    }
    project.pluginManager.apply(ArtifactoryPlugin)
}

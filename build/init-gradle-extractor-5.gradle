// jf gradle writes this file as --init-script. --include-shared-build becomes
// ORG_GRADLE_PROJECT_includeSharedBuild=true and -PincludeSharedBuild=true, which
// SharedBuildLogicUtils.isIncludeSharedBuildEnabled reads via Project.findProperty.
import org.jfrog.gradle.plugin.artifactory.ArtifactoryPlugin
import org.jfrog.gradle.plugin.artifactory.ArtifactoryPluginSettings
import org.jfrog.gradle.plugin.artifactory.Constant
import org.jfrog.gradle.plugin.artifactory.extractor.ExternalProjectModuleInfoFileProducer
import org.jfrog.gradle.plugin.artifactory.task.ArtifactoryTask
import org.jfrog.gradle.plugin.artifactory.task.DeployTask
import org.jfrog.gradle.plugin.artifactory.utils.PluginUtils;
import org.jfrog.gradle.plugin.artifactory.utils.SharedBuildLogicUtils

initscript {
    dependencies {
        classpath fileTree('${pluginLibDir}')
    }
}

PluginUtils.assertGradleVersionSupported(getGradle())

beforeSettings { Settings settings ->
    settings.apply plugin: ArtifactoryPluginSettings
}

projectsLoaded { Gradle gradle ->
    Map<String, String> projectProperties = new HashMap<String, String>(gradle.startParameter.getProjectProperties())
    projectProperties.put("build.start", Long.toString(System.currentTimeMillis()))
    gradle.startParameter.setProjectProperties(projectProperties)
    Project root = gradle.getRootProject()
    root.logger.debug("Artifactory plugin: projectsEvaluated: ${root.name}")
    // Tell ArtifactoryPlugin.apply() not to register the same shared builds a second time.
    root.ext.set('jfrogInitScriptManagesSharedBuild', true)

    if (gradle.parent == null) {
        root.allprojects { Project p ->
            applyArtifactoryIfMissing(p)
        }
        // Collect shared builds (buildSrc, includedBuilds) when flag is enabled
        if (SharedBuildLogicUtils.isIncludeSharedBuildEnabled(root)) {
            collectSharedBuildDependencies(gradle, root)
        }
    } else if ("buildSrc".equals(root.name)) {
        // buildSrc stays unapplied unless includeSharedBuild is explicitly on.
        if (SharedBuildLogicUtils.isIncludeSharedBuildEnabled(root)) {
            applyPluginAndCollectSharedBuildDependencies(gradle, root)
        }
    } else {
        // Included builds always get the plugin (needed for ExternalProjectModuleInfoFileProducer).
        // Collecting their dependencies is still opt-in.
        root.allprojects { Project p ->
            applyArtifactoryIfMissing(p)
        }
        if (SharedBuildLogicUtils.isIncludeSharedBuildEnabled(root)) {
            collectSharedBuildDependencies(gradle, root)
        }
    }

    for (Project p : root.getAllprojects()) {
        try {
            TaskProvider<? extends Task> subCollectInfoTask = p.getTasks().named(Constant.ARTIFACTORY_PUBLISH_TASK_NAME, ArtifactoryTask.class);
            subCollectInfoTask.configure { task ->
                task.setCiServerBuild()
            }
        } catch (UnknownTaskException ignored) {
            root.logger.debug("Can't find sub project configured for {}", p.getPath());
        }
    }
}

void applyArtifactoryIfMissing(Project project) {
    if (project.extensions.findByName(Constant.ARTIFACTORY) != null) {
        return
    }
    project.pluginManager.apply(ArtifactoryPlugin)
}

void applyPluginAndCollectSharedBuildDependencies(Gradle gradle, Project root) {
    root.allprojects { Project p ->
        applyArtifactoryIfMissing(p)
    }
    collectSharedBuildDependencies(gradle, root)
}

/**
 * Walk to the top-level DeployTask and register an eager producer for this shared build.
 */
void collectSharedBuildDependencies(Gradle gradle, Project root) {
    // gradle.parent is only the immediate parent; nested includes must walk to the true top-level build.
    Gradle topLevelGradle = gradle
    while (topLevelGradle.parent != null) {
        topLevelGradle = topLevelGradle.parent
    }
    Project containingRoot = topLevelGradle.getRootProject()
    String buildPath = root.projectDir.absolutePath
    String gradleCmd = SharedBuildLogicUtils.resolveGradleExecutable(root.projectDir)
    def export = SharedBuildLogicUtils.exportSharedBuild(gradleCmd, buildPath)
    // Use the API dump when it has dependencies; otherwise run the dependencies subprocess.
    String dependenciesOutput = export != null && export.dependencyCount > 0
            ? export.rawJson
            : SharedBuildLogicUtils.runDependenciesSubprocess(gradleCmd, buildPath)
    if (dependenciesOutput == null || dependenciesOutput.isEmpty()) {
        root.logger.warn("Failed to collect dependencies for shared build '${root.name}' at ${buildPath}")
    }
    containingRoot.tasks.withType(DeployTask).configureEach { deployTask ->
        root.allprojects.each { Project externalProject ->
            deployTask.registerModuleInfoProducer(new ExternalProjectModuleInfoFileProducer(externalProject, null, dependenciesOutput))
        }
    }
}
